<script>
            // ── SHARED HELPERS ──────────────────────────────────────────
            function statusChip(active) {
                return active === false
                    ? `<span class="status-chip" style="background:var(--red-bg);color:var(--red)">Inactive</span>`
                    : `<span class="status-chip" style="background:var(--green-bg);color:var(--green)">Active</span>`;
            }

            // ── TRUCKS ADMIN ──────────────────────────────────────────
            function renderTrucksAdmin() {
                const q = (
                    document.getElementById("trucks-search").value || ""
                ).toLowerCase();
                const showInactive = document.getElementById(
                    "trucks-show-inactive",
                ).checked;
                const tbody = document.getElementById("trucks-tbody");

                const filtered = trucks.filter((t) => {
                    if (!showInactive && t.active === false) return false;
                    return (
                        !q ||
                        (t.plate || "").toLowerCase().includes(q) ||
                        (t.brand || "").toLowerCase().includes(q) ||
                        (t.type || "").toLowerCase().includes(q)
                    );
                });
                document.getElementById("trucks-count").textContent =
                    `${filtered.length} trucks`;

                tbody.innerHTML = filtered
                    .map((t) => {
                        const selCls =
                            selectedTruckAdminId === t.id
                                ? " row-selected"
                                : "";
                        return `<tr class="${selCls.trim()}" style="cursor:pointer" onclick="selectTruckAdmin(${t.id})">
    <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">${t.id}</td>
    <td style="font-weight:500;font-family:'DM Mono',monospace">${esc(t.plate)}</td>
    <td style="font-size:11px;color:var(--muted)">${esc(t.type) || "—"}</td>
    <td>${statusChip(t.active)}</td>
  </tr>`;
                    })
                    .join("");
            }

            function selectTruckAdmin(id) {
                selectedTruckAdminId = Number(id);
                renderTrucksAdmin();
                renderTruckDetail();
            }

            function renderTruckDetail() {
                const body = document.getElementById("truck-detail-body");
                const footer = document.getElementById(
                    "truck-detail-footer",
                );

                if (!selectedTruckAdminId) {
                    body.innerHTML = `<div class="empty-board" style="padding:24px 0"><div class="icon">🚚</div><div class="sub">Select a truck to view details</div></div>`;
                    footer.style.display = "none";
                    footer.innerHTML = "";
                    return;
                }
                const t = trucks.find(
                    (t) => Number(t.id) === Number(selectedTruckAdminId),
                );
                if (!t) {
                    selectedTruckAdminId = null;
                    renderTruckDetail();
                    return;
                }
                const isAdmin = currentUser.role === "Admin";
                const dis = isAdmin ? "" : "disabled";

                body.innerHTML = `
      <div class="form-row">
        <label class="form-label">Plate Number</label>
        <input type="text" id="td-plate" value="${esc(t.plate)}" ${dis}>
      </div>
      <div class="form-row">
        <label class="form-label">Brand</label>
        <input type="text" id="td-brand" value="${esc(t.brand)}" ${dis}>
      </div>
      <div class="form-row">
        <label class="form-label">Type</label>
        <input type="text" id="td-type" value="${esc(t.type)}" ${dis}>
      </div>
      <div class="form-row">
        <label class="form-label">Billing Category</label>
        <select id="td-billing-category" ${dis}>${billingCategoryOptions(t.billingCategory)}</select>
      </div>
      <div class="section-lbl">Status</div>
      <div>${statusChip(t.active)}</div>`;

                if (isAdmin) {
                    footer.style.display = "";
                    footer.innerHTML = `
        <button class="btn btn-primary btn-sm" onclick="saveTruckDetail()">Save changes</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="toggleTruckActive(${t.id})">${t.active === false ? "Restore" : "Remove"}</button>`;
                } else {
                    footer.style.display = "none";
                    footer.innerHTML = "";
                }
            }

            function saveTruckDetail() {
                const id = selectedTruckAdminId;
                const plate = document.getElementById("td-plate").value;
                const brand = document.getElementById("td-brand").value;
                const type = document.getElementById("td-type").value;
                const billingCategory = document.getElementById(
                    "td-billing-category",
                ).value;
                if (!plate.trim()) {
                    showToast("Plate number is required.", "error");
                    return;
                }
                setSyncing(true);
                google.script.run
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Save failed: " + r.error, "error");
                            return;
                        }
                        const t = trucks.find((t) => t.id === id);
                        if (t) Object.assign(t, r.truck);
                        showToast("Truck updated.", "success");
                        renderTrucksAdmin();
                        renderTruckDetail();
                        renderTruckList();
                        renderDefaults();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .updateTruck(id, { plate, brand, type, billingCategory });
            }

            function toggleTruckActive(id) {
                const t = trucks.find((t) => t.id === id);
                if (!t) return;
                const makeActive = t.active === false;
                const verb = makeActive ? "restore" : "remove";
                if (!confirm(`Are you sure you want to ${verb} ${t.plate}?`))
                    return;

                setSyncing(true);
                google.script.run
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Save failed: " + r.error, "error");
                            return;
                        }
                        Object.assign(t, r.truck);
                        showToast(
                            `${t.plate} ${makeActive ? "restored" : "removed"}.`,
                            "success",
                        );
                        renderTrucksAdmin();
                        renderTruckDetail();
                        renderTruckList();
                        renderDefaults();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .updateTruck(id, { active: makeActive });
            }

            function openAddTruckModal() {
                document.getElementById("nt-plate").value = "";
                document.getElementById("nt-brand").value = "";
                document.getElementById("nt-type").value = "";
                document.getElementById("nt-billing-category").innerHTML =
                    billingCategoryOptions("");
                openModal("modal-add-truck");
            }

            function submitAddTruck() {
                const plate = document.getElementById("nt-plate").value.trim();
                const brand = document.getElementById("nt-brand").value.trim();
                const type = document.getElementById("nt-type").value.trim();
                const billingCategory = document.getElementById(
                    "nt-billing-category",
                ).value;
                if (!plate) {
                    showToast("Plate number is required.", "error");
                    return;
                }
                setSyncing(true);
                google.script.run
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Add failed: " + r.error, "error");
                            return;
                        }
                        trucks.push(r.truck);
                        if (r.defaultAssignment)
                            defaultAssignments.push(r.defaultAssignment);
                        closeModal("modal-add-truck");
                        showToast(`${r.truck.plate} added.`, "success");
                        renderTrucksAdmin();
                        renderTruckList();
                        renderDefaults();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .createTruck({ plate, brand, type, billingCategory });
            }

            // ── EMPLOYEES ADMIN ───────────────────────────────────────
            function renderEmployeesAdmin() {
                const q = (
                    document.getElementById("employees-search").value || ""
                ).toLowerCase();
                const showInactive = document.getElementById(
                    "employees-show-inactive",
                ).checked;
                const tbody = document.getElementById("employees-tbody");

                const filtered = employees.filter((e) => {
                    if (!showInactive && e.active === false) return false;
                    return (
                        !q ||
                        (e.nick || "").toLowerCase().includes(q) ||
                        (e.firstName || "").toLowerCase().includes(q) ||
                        (e.lastName || "").toLowerCase().includes(q)
                    );
                });
                document.getElementById("employees-count").textContent =
                    `${filtered.length} employees`;

                tbody.innerHTML = filtered
                    .map((e) => {
                        const selCls =
                            selectedEmployeeAdminId === e.id
                                ? " row-selected"
                                : "";
                        return `<tr class="${selCls.trim()}" style="cursor:pointer" onclick="selectEmployeeAdmin(${e.id})">
    <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">${e.id}</td>
    <td style="font-weight:500">${esc(e.nick)}</td>
    <td><span class="badge ${e.role === "Driver" ? "badge-driver" : "badge-helper"}">${esc(e.role)}</span></td>
    <td>${statusChip(e.active)}</td>
  </tr>`;
                    })
                    .join("");
            }

            function selectEmployeeAdmin(id) {
                selectedEmployeeAdminId = Number(id);
                renderEmployeesAdmin();
                renderEmployeeDetail();
            }

            function renderEmployeeDetail() {
                const body = document.getElementById("employee-detail-body");
                const footer = document.getElementById(
                    "employee-detail-footer",
                );

                if (!selectedEmployeeAdminId) {
                    body.innerHTML = `<div class="empty-board" style="padding:24px 0"><div class="icon">🧑</div><div class="sub">Select an employee to view details</div></div>`;
                    footer.style.display = "none";
                    footer.innerHTML = "";
                    return;
                }
                const em = employees.find(
                    (e) => Number(e.id) === Number(selectedEmployeeAdminId),
                );
                if (!em) {
                    selectedEmployeeAdminId = null;
                    renderEmployeeDetail();
                    return;
                }
                const isAdmin = currentUser.role === "Admin";
                const dis = isAdmin ? "" : "disabled";

                body.innerHTML = `
      <div class="form-row">
        <label class="form-label">Nickname</label>
        <input type="text" id="ed-nick" value="${esc(em.nick)}" ${dis}>
      </div>
      <div class="form-row">
        <label class="form-label">First Name</label>
        <input type="text" id="ed-first" value="${esc(em.firstName)}" ${dis}>
      </div>
      <div class="form-row">
        <label class="form-label">Middle Name</label>
        <input type="text" id="ed-middle" value="${esc(em.middleName)}" ${dis}>
      </div>
      <div class="form-row">
        <label class="form-label">Last Name</label>
        <input type="text" id="ed-last" value="${esc(em.lastName)}" ${dis}>
      </div>
      <div class="form-row">
        <label class="form-label">Role</label>
        <select id="ed-role" ${dis}>
          <option value="Driver" ${em.role === "Driver" ? "selected" : ""}>Driver</option>
          <option value="Helper" ${em.role === "Helper" ? "selected" : ""}>Helper</option>
        </select>
      </div>
      <div class="section-lbl">Status</div>
      <div>${statusChip(em.active)}</div>`;

                if (isAdmin) {
                    footer.style.display = "";
                    footer.innerHTML = `
        <button class="btn btn-primary btn-sm" onclick="saveEmployeeDetail()">Save changes</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="toggleEmployeeActive(${em.id})">${em.active === false ? "Restore" : "Remove"}</button>`;
                } else {
                    footer.style.display = "none";
                    footer.innerHTML = "";
                }
            }

            function saveEmployeeDetail() {
                const id = selectedEmployeeAdminId;
                const nick = document.getElementById("ed-nick").value;
                const firstName = document.getElementById("ed-first").value;
                const middleName =
                    document.getElementById("ed-middle").value;
                const lastName = document.getElementById("ed-last").value;
                const role = document.getElementById("ed-role").value;
                if (!nick.trim()) {
                    showToast("Nickname is required.", "error");
                    return;
                }
                setSyncing(true);
                google.script.run
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Save failed: " + r.error, "error");
                            return;
                        }
                        const em = employees.find((e) => e.id === id);
                        if (em)
                            Object.assign(em, {
                                nick,
                                firstName,
                                middleName,
                                lastName,
                                role,
                            });
                        showToast("Employee updated.", "success");
                        renderEmployeesAdmin();
                        renderEmployeeDetail();
                        renderEmpList();
                        renderDefEmpList();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .updateEmployee(id, {
                        nick,
                        firstName,
                        middleName,
                        lastName,
                        role,
                    });
            }

            function toggleEmployeeActive(id) {
                const em = employees.find((e) => e.id === id);
                if (!em) return;
                const makeActive = em.active === false;
                const verb = makeActive ? "restore" : "remove";
                if (!confirm(`Are you sure you want to ${verb} ${em.nick}?`))
                    return;

                setSyncing(true);
                google.script.run
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Save failed: " + r.error, "error");
                            return;
                        }
                        em.active = makeActive;
                        showToast(
                            `${em.nick} ${makeActive ? "restored" : "removed"}.`,
                            "success",
                        );
                        renderEmployeesAdmin();
                        renderEmployeeDetail();
                        renderEmpList();
                        renderDefEmpList();
                        renderUnassignedCrewStat();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .updateEmployee(id, { active: makeActive });
            }

            function openAddEmployeeModal() {
                document.getElementById("ne-nick").value = "";
                document.getElementById("ne-first").value = "";
                document.getElementById("ne-middle").value = "";
                document.getElementById("ne-last").value = "";
                document.getElementById("ne-role").value = "Driver";
                openModal("modal-add-employee");
            }

            function submitAddEmployee() {
                const nick = document.getElementById("ne-nick").value.trim();
                const firstName = document
                    .getElementById("ne-first")
                    .value.trim();
                const middleName = document
                    .getElementById("ne-middle")
                    .value.trim();
                const lastName = document
                    .getElementById("ne-last")
                    .value.trim();
                const role = document.getElementById("ne-role").value;
                if (!nick) {
                    showToast("Nickname is required.", "error");
                    return;
                }
                setSyncing(true);
                google.script.run
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Add failed: " + r.error, "error");
                            return;
                        }
                        employees.push(r.employee);
                        closeModal("modal-add-employee");
                        showToast(`${r.employee.nick} added.`, "success");
                        renderEmployeesAdmin();
                        renderEmpList();
                        renderDefEmpList();
                        renderUnassignedCrewStat();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .createEmployee({
                        nick,
                        firstName,
                        middleName,
                        lastName,
                        role,
                    });
            }

            // ── BILLING CATEGORIES ADMIN ─────────────────────────────
            function renderBillingCategoriesAdmin() {
                const showInactive = document.getElementById(
                    "billing-categories-show-inactive",
                ).checked;
                const tbody = document.getElementById(
                    "billing-categories-tbody",
                );

                const filtered = billingCategories.filter(
                    (c) => showInactive || c.active !== false,
                );
                document.getElementById(
                    "billing-categories-count",
                ).textContent = `${filtered.length} categories`;

                tbody.innerHTML = filtered
                    .map((c) => {
                        const selCls =
                            selectedBillingCategoryId === c.id
                                ? " row-selected"
                                : "";
                        return `<tr class="${selCls.trim()}" style="cursor:pointer" onclick="selectBillingCategory(${c.id})">
    <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">${c.id}</td>
    <td style="font-weight:500;font-family:'DM Mono',monospace">${esc(c.name)}</td>
    <td>${statusChip(c.active)}</td>
  </tr>`;
                    })
                    .join("");
            }

            function selectBillingCategory(id) {
                selectedBillingCategoryId = Number(id);
                renderBillingCategoriesAdmin();
                renderBillingCategoryDetail();
            }

            function renderBillingCategoryDetail() {
                const body = document.getElementById(
                    "billing-category-detail-body",
                );
                const footer = document.getElementById(
                    "billing-category-detail-footer",
                );

                if (!selectedBillingCategoryId) {
                    body.innerHTML = `<div class="empty-board" style="padding:24px 0"><div class="icon">🏷️</div><div class="sub">Select a category to view details</div></div>`;
                    footer.style.display = "none";
                    footer.innerHTML = "";
                    return;
                }
                const c = billingCategories.find(
                    (c) =>
                        Number(c.id) === Number(selectedBillingCategoryId),
                );
                if (!c) {
                    selectedBillingCategoryId = null;
                    renderBillingCategoryDetail();
                    return;
                }
                const isAdmin = currentUser.role === "Admin";
                const dis = isAdmin ? "" : "disabled";

                body.innerHTML = `
      <div class="form-row">
        <label class="form-label">Name</label>
        <input type="text" id="bcd-name" value="${esc(c.name)}" ${dis}>
      </div>
      <div class="section-lbl">Status</div>
      <div>${statusChip(c.active)}</div>`;

                if (isAdmin) {
                    footer.style.display = "";
                    footer.innerHTML = `
        <button class="btn btn-primary btn-sm" onclick="saveBillingCategoryDetail()">Save changes</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="toggleBillingCategoryActive(${c.id})">${c.active === false ? "Restore" : "Remove"}</button>`;
                } else {
                    footer.style.display = "none";
                    footer.innerHTML = "";
                }
            }

            function saveBillingCategoryDetail() {
                const id = selectedBillingCategoryId;
                const name = document.getElementById("bcd-name").value;
                if (!name.trim()) {
                    showToast("Name is required.", "error");
                    return;
                }
                const bc = billingCategories.find((c) => c.id === id);
                const oldName = bc ? bc.name : null;

                setSyncing(true);
                google.script.run
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Save failed: " + r.error, "error");
                            return;
                        }
                        if (bc) Object.assign(bc, r.billingCategory);
                        if (oldName && oldName !== r.billingCategory.name) {
                            trucks.forEach((t) => {
                                if (t.billingCategory === oldName)
                                    t.billingCategory =
                                        r.billingCategory.name;
                            });
                        }
                        showToast("Billing category updated.", "success");
                        renderBillingCategoriesAdmin();
                        renderBillingCategoryDetail();
                        renderTrucksAdmin();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .updateBillingCategory(id, { name });
            }

            function toggleBillingCategoryActive(id) {
                const c = billingCategories.find((c) => c.id === id);
                if (!c) return;
                const makeActive = c.active === false;
                const verb = makeActive ? "restore" : "remove";
                if (!confirm(`Are you sure you want to ${verb} ${c.name}?`))
                    return;

                setSyncing(true);
                google.script.run
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Save failed: " + r.error, "error");
                            return;
                        }
                        Object.assign(c, r.billingCategory);
                        showToast(
                            `${c.name} ${makeActive ? "restored" : "removed"}.`,
                            "success",
                        );
                        renderBillingCategoriesAdmin();
                        renderBillingCategoryDetail();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .updateBillingCategory(id, { active: makeActive });
            }

            function openAddBillingCategoryModal() {
                document.getElementById("nbc-name").value = "";
                openModal("modal-add-billing-category");
            }

            function submitAddBillingCategory() {
                const name = document.getElementById("nbc-name").value.trim();
                if (!name) {
                    showToast("Name is required.", "error");
                    return;
                }
                setSyncing(true);
                google.script.run
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Add failed: " + r.error, "error");
                            return;
                        }
                        billingCategories.push(r.billingCategory);
                        closeModal("modal-add-billing-category");
                        showToast(
                            `${r.billingCategory.name} added.`,
                            "success",
                        );
                        renderBillingCategoriesAdmin();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .createBillingCategory({ name });
            }
        </script>
