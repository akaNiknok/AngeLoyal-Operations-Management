<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- The one stable link operators are given. It only forwards to wherever the
       app currently lives, so the app can move (a renamed Pages project, a new
       Cloudflare account at handover) without anyone re-bookmarking anything.
       Change the two URLs below and re-publish; that is the whole maintenance. -->
  <meta http-equiv="refresh" content="0; url=https://angeloyal-oms.pages.dev" />
  <title>Open AngeLoyal OMS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      text-align: center;
    }
    .card {
      max-width: 440px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
    }
    .logo { font-size: 40px; line-height: 1; }
    h1 { font-size: 22px; margin: 12px 0 4px; }
    p { margin: 8px 0; color: #6b7280; font-size: 15px; line-height: 1.5; }
    a {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #1d4ed8;
      border-radius: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🚚</div>
    <h1>AngeLoyal OMS</h1>
    <p>Opening the Operations Management System…</p>
    <p><a href="https://angeloyal-oms.pages.dev">Continue now →</a></p>
  </main>
</body>
</html>
