<script>
            // ── TRUCK ROSTER ──────────────────────────────────────────
            // The roster is the Default Assignments sheet: one row per truck
            // holding its default driver + helpers. This panel edits it via
            // click-to-assign or drag-and-drop; the dispatch board's Crew Rail
            // reads the same data and stamps it onto trips (see assignCrew).

            function defForTruck(truckId) {
                return defaultAssignments.find(
                    (a) => Number(a.truckId) === Number(truckId),
                );
            }

            // Pseudo-crew ({employeeId, type}) derived from a truck's def row.
            function getRosterCrew(truckId) {
                const def = defForTruck(truckId);
                if (!def) return [];
                const crew = [];
                if (def.defaultDriverId != null)
                    crew.push({
                        employeeId: Number(def.defaultDriverId),
                        type: "Driver",
                    });
                (def.defaultHelperIds || []).forEach((h) =>
                    crew.push({ employeeId: Number(h), type: "Helper" }),
                );
                return crew;
            }

            // Which truck (if any) an employee is currently rostered on.
            function getEmpAssignment(empId) {
                empId = Number(empId);
                for (const def of defaultAssignments) {
                    if (Number(def.defaultDriverId) === empId)
                        return {
                            truckId: Number(def.truckId),
                            type: "Driver",
                            defId: def.id,
                        };
                    if ((def.defaultHelperIds || []).map(Number).includes(empId))
                        return {
                            truckId: Number(def.truckId),
                            type: "Helper",
                            defId: def.id,
                        };
                }
                return null;
            }

            function crewStatus(truckId) {
                const crew = getRosterCrew(truckId);
                const hasD = crew.some((a) => a.type === "Driver");
                const hasH = crew.some((a) => a.type === "Helper");
                if (hasD && hasH) return "full";
                if (hasD || hasH) return "partial";
                return "empty";
            }

            function getUnassignedCrew() {
                return employees.filter(
                    (e) =>
                        e.active !== false &&
                        (e.role === "Driver" ||
                            e.role === "Helper" ||
                            e.role === "Driver-Helper") &&
                        !getEmpAssignment(e.id),
                );
            }

            function renderUnassignedCrewStat() {
                const cell = document.getElementById("ds-unassigned-crew");
                if (cell) cell.textContent = getUnassignedCrew().length;
            }

            function rerenderRoster() {
                renderTruckList();
                renderEmpList();
                renderRosterDetail();
                renderUnassignedCrewStat();
                renderCrewRail(); // keep the dispatch Crew Rail in sync if open
            }

            function renderTruckList() {
                const list = document.getElementById("truck-list");
                if (!list) return;
                const q = (
                    document.getElementById("truck-search").value || ""
                ).toLowerCase();
                const filtered = trucks.filter(
                    (t) =>
                        !q ||
                        (t.plate || "").toLowerCase().includes(q) ||
                        (t.type || "").toLowerCase().includes(q) ||
                        (t.brand || "").toLowerCase().includes(q),
                );
                document.getElementById("truck-count").textContent =
                    `${filtered.length}/${trucks.length}`;
                const drop = canEdit()
                    ? ` ondragover="rosterTruckDragOver(event)" ondragleave="rosterTruckDragLeave(event)" ondrop="rosterTruckDrop(event, __ID__)"`
                    : "";
                list.innerHTML = filtered
                    .map((t) => {
                        const status = crewStatus(t.id);
                        const pipCls =
                            status === "full"
                                ? "pip-full"
                                : status === "partial"
                                  ? "pip-partial"
                                  : "pip-empty";
                        const selCls =
                            selectedRosterTruckId == t.id ? " selected" : "";
                        return `<div class="list-item${selCls}" onclick="selectRosterTruck(${t.id})"${drop.replace(/__ID__/g, t.id)}>
      <span class="status-pip ${pipCls}"></span>
      <div style="min-width:0;flex:1">
        <div class="item-main">${esc(t.plate)}</div>
        <div class="item-sub">${esc(t.type)}</div>
      </div>
    </div>`;
                    })
                    .join("");
            }

            function renderEmpList() {
                const list = document.getElementById("emp-list");
                if (!list) return;
                const q = (
                    document.getElementById("emp-search").value || ""
                ).toLowerCase();
                const filtered = employees.filter((e) => {
                    const matchQ =
                        !q || (e.nick || "").toLowerCase().includes(q);
                    const asgn = getEmpAssignment(e.id);
                    if (empFilter === "Driver")
                        return (
                            matchQ &&
                            (e.role === "Driver" ||
                                e.role === "Driver-Helper")
                        );
                    if (empFilter === "Helper")
                        return (
                            matchQ &&
                            (e.role === "Helper" ||
                                e.role === "Driver-Helper")
                        );
                    if (empFilter === "unassigned") return matchQ && !asgn;
                    return matchQ;
                });
                document.getElementById("emp-count-label").textContent =
                    `${filtered.length} shown`;
                const drag = canEdit();
                list.innerHTML = filtered
                    .map((e) => {
                        const asgn = getEmpAssignment(e.id);
                        const truck = asgn
                            ? trucks.find(
                                  (t) => Number(t.id) === Number(asgn.truckId),
                              )
                            : null;
                        const isSel = selectedRosterEmpId == e.id;
                        const isDimmed = !!asgn && !isSel;
                        const dragAttr = drag
                            ? ` draggable="true" ondragstart="rosterEmpDragStart(event, ${e.id})"`
                            : "";
                        return `<div class="list-item${isSel ? " selected" : ""}${isDimmed ? " dimmed" : ""}${drag ? " draggable-row" : ""}" onclick="selectRosterEmp(${e.id})"${dragAttr}>
      <span class="badge ${roleBadgeClass(e.role)}">${roleBadgeAbbr(e.role)}</span>
      <div style="min-width:0;flex:1">
        <div class="item-main">${esc(e.nick)}</div>
        <div class="item-sub">${truck ? truck.plate : "Unassigned"}</div>
      </div>
    </div>`;
                    })
                    .join("");
            }

            function setEmpFilter(f, btn) {
                empFilter = f;
                btn.parentElement
                    .querySelectorAll(".pill")
                    .forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
                renderEmpList();
            }

            function renderRosterDetail() {
                const body = document.getElementById("roster-detail-body");
                if (!body) return;
                const bar = document.getElementById("roster-assign-bar");
                const btn = document.getElementById("roster-assign-btn");
                const btn2 = document.getElementById("roster-assign-btn2");
                const hint = document.getElementById("roster-assign-hint");
                const editable = canEdit();

                if (!selectedRosterTruckId) {
                    body.innerHTML = `<div class="empty-board" style="padding:24px 0"><div class="icon">🚚</div><div class="sub">Select a truck to view its crew</div></div>`;
                    bar.style.display = "none";
                    return;
                }
                bar.style.display = editable ? "" : "none";
                const t = trucks.find(
                    (t) => Number(t.id) === Number(selectedRosterTruckId),
                );
                const def = defForTruck(selectedRosterTruckId);
                const crew = getRosterCrew(selectedRosterTruckId);
                const driver = crew.find((a) => a.type === "Driver");
                const helpers = crew.filter((a) => a.type === "Helper");
                const rmBtn = (empId, type) =>
                    editable
                        ? `<button class="remove-btn" onclick="doRosterRemove(${empId},'${type}')">Remove</button>`
                        : "";

                let html = `<div class="detail-plate">${esc(t.plate)}</div>
              <div class="detail-type">${esc(t.brand)} · ${esc(t.type)}</div>
              <div class="section-lbl">Driver</div>`;
                if (driver) {
                    const em = employees.find(
                        (e) => Number(e.id) === Number(driver.employeeId),
                    );
                    html += `<div class="crew-item"><span class="badge badge-driver">Driver</span><span class="crew-item-name">${esc(em?.nick || "?")}</span>
             ${rmBtn(driver.employeeId, "Driver")}</div>`;
                } else {
                    html += `<div style="font-size:11px;color:var(--hint);font-style:italic;padding:3px 0">No driver assigned</div>`;
                }
                html += `<div class="section-lbl">Helpers (${helpers.length})</div>`;
                if (helpers.length > 0) {
                    helpers.forEach((h) => {
                        const em = employees.find(
                            (e) => Number(e.id) === Number(h.employeeId),
                        );
                        html += `<div class="crew-item"><span class="badge badge-helper">Helper</span><span class="crew-item-name">${esc(em?.nick || "?")}</span>
               ${rmBtn(h.employeeId, "Helper")}</div>`;
                    });
                } else {
                    html += `<div style="font-size:11px;color:var(--hint);font-style:italic;padding:3px 0">No helpers assigned</div>`;
                }
                if (def) {
                    html += `<div class="section-lbl">Notes</div>
              <input class="cell-input" style="width:100%" value="${esc(def.notes || "")}" ${editable ? "" : "disabled"} placeholder="notes…" onchange="saveRosterNotes(${def.id}, this.value)">`;
                }
                body.innerHTML = html;

                if (!editable) return;

                if (selectedRosterEmpId) {
                    const em = employees.find(
                        (e) => Number(e.id) === Number(selectedRosterEmpId),
                    );
                    const onThisTruck = crew.find(
                        (a) =>
                            Number(a.employeeId) ===
                            Number(selectedRosterEmpId),
                    );
                    btn2.style.display = "none";
                    if (onThisTruck) {
                        btn.textContent = `Remove ${em.nick}`;
                        btn.className = "assign-btn";
                        btn.style.background = "var(--red-bg)";
                        btn.style.color = "var(--red)";
                        btn.onclick = () => doAssign();
                        hint.textContent = "";
                    } else if (em.role === "Driver-Helper") {
                        btn.textContent = `Assign as Driver → ${t.plate}`;
                        btn.className = "assign-btn primary";
                        btn.style.background = "";
                        btn.style.color = "";
                        btn.onclick = () => doAssign("Driver");
                        btn2.textContent = `Assign as Helper → ${t.plate}`;
                        btn2.className = "assign-btn primary";
                        btn2.style.display = "";
                        btn2.onclick = () => doAssign("Helper");
                        const existing = getEmpAssignment(em.id);
                        hint.textContent = existing
                            ? `Will move from ${trucks.find((t) => Number(t.id) === Number(existing.truckId))?.plate}`
                            : "";
                    } else {
                        btn.textContent = `Assign ${em.nick} → ${t.plate}`;
                        btn.className = "assign-btn primary";
                        btn.style.background = "";
                        btn.style.color = "";
                        btn.onclick = () => doAssign(em.role);
                        const existing = getEmpAssignment(em.id);
                        hint.textContent = existing
                            ? `Will move from ${trucks.find((t) => Number(t.id) === Number(existing.truckId))?.plate}`
                            : "";
                    }
                } else {
                    btn.textContent = "Assign employee";
                    btn.className = "assign-btn disabled";
                    btn.style.background = "";
                    btn.style.color = "";
                    btn.onclick = () => doAssign();
                    btn2.style.display = "none";
                    hint.textContent = "Select an employee, or drag one onto a truck →";
                }
            }

            function selectRosterTruck(id) {
                selectedRosterTruckId = Number(id);
                selectedRosterEmpId = null;
                renderTruckList();
                renderEmpList();
                renderRosterDetail();
            }
            function selectRosterEmp(id) {
                if (!selectedRosterTruckId) {
                    showToast("Select a truck first.");
                    return;
                }
                selectedRosterEmpId =
                    selectedRosterEmpId == id ? null : Number(id);
                renderEmpList();
                renderRosterDetail();
            }

            // ── ROSTER WRITES (optimistic, persist to Default Assignments) ──
            function snapshotDefs() {
                return defaultAssignments.map((d) => ({
                    id: d.id,
                    defaultDriverId: d.defaultDriverId,
                    defaultHelperIds: (d.defaultHelperIds || []).slice(),
                }));
            }
            function restoreDefs(snap) {
                snap.forEach((s) => {
                    const d = defaultAssignments.find((x) => x.id === s.id);
                    if (d) {
                        d.defaultDriverId = s.defaultDriverId;
                        d.defaultHelperIds = s.defaultHelperIds.slice();
                    }
                });
            }
            function removeEmpFromDef(defId, empId) {
                const d = defaultAssignments.find((x) => x.id === defId);
                if (!d) return;
                empId = Number(empId);
                if (Number(d.defaultDriverId) === empId)
                    d.defaultDriverId = null;
                d.defaultHelperIds = (d.defaultHelperIds || [])
                    .map(Number)
                    .filter((h) => h !== empId);
            }
            // Persist the given def rows; a failure reverts ALL to the snapshot.
            function persistDefs(defIds, snap) {
                const revert = () => {
                    restoreDefs(snap);
                    rerenderRoster();
                };
                defIds.forEach((id) => {
                    const d = defaultAssignments.find((x) => x.id === id);
                    bgSave(
                        "updateDefaultAssignment",
                        [
                            id,
                            {
                                defaultDriverId: d.defaultDriverId,
                                defaultHelperIds: d.defaultHelperIds,
                            },
                        ],
                        { revert },
                    );
                });
            }

            function doAssign(type) {
                if (saving || !selectedRosterTruckId || !selectedRosterEmpId)
                    return;
                if (!canEdit()) return;
                const em = employees.find(
                    (e) => Number(e.id) === Number(selectedRosterEmpId),
                );
                const def = defForTruck(selectedRosterTruckId);
                const t = trucks.find(
                    (x) => Number(x.id) === Number(selectedRosterTruckId),
                );
                if (!em || !t) return;
                if (!def) {
                    showToast("This truck has no roster row.", "error");
                    return;
                }

                // Already on this truck → toggle off (remove).
                const here = getRosterCrew(def.truckId).find(
                    (a) => Number(a.employeeId) === Number(em.id),
                );
                if (here) {
                    doRosterRemove(em.id, here.type);
                    return;
                }

                const assignType =
                    type ||
                    (em.role === "Driver-Helper" ? "Driver" : em.role);

                if (
                    assignType === "Helper" &&
                    (def.defaultHelperIds || []).length >= 3
                ) {
                    showToast(
                        "A truck can have at most 3 helpers.",
                        "warning",
                    );
                    return;
                }
                if (
                    assignType === "Driver" &&
                    def.defaultDriverId != null &&
                    Number(def.defaultDriverId) !== Number(em.id)
                ) {
                    const dNick = (
                        employees.find(
                            (e) =>
                                Number(e.id) === Number(def.defaultDriverId),
                        ) || {}
                    ).nick;
                    if (!confirm(`${t.plate} already has driver ${dNick}. Replace?`))
                        return;
                }
                const existing = getEmpAssignment(em.id);
                if (
                    existing &&
                    !confirm(
                        `${em.nick} is on ${(trucks.find((x) => Number(x.id) === existing.truckId) || {}).plate}. Move to ${t.plate}?`,
                    )
                )
                    return;

                const snap = snapshotDefs();
                const ids = new Set([def.id]);
                if (existing && existing.defId !== def.id) {
                    removeEmpFromDef(existing.defId, em.id);
                    ids.add(existing.defId);
                }
                if (assignType === "Driver") {
                    def.defaultDriverId = Number(em.id);
                } else {
                    def.defaultHelperIds = [
                        ...new Set([
                            ...(def.defaultHelperIds || []).map(Number),
                            Number(em.id),
                        ]),
                    ];
                }

                selectedRosterEmpId = null;
                rerenderRoster();
                showToast(`${em.nick} → ${t.plate}`, "success");
                persistDefs([...ids], snap);
            }

            function doRosterRemove(empId, type) {
                if (!canEdit()) return;
                const asg = getEmpAssignment(empId);
                if (!asg) return;
                if (!confirm(`Remove this ${type.toLowerCase()} from their truck?`))
                    return;
                const snap = snapshotDefs();
                removeEmpFromDef(asg.defId, empId);
                if (Number(selectedRosterEmpId) === Number(empId))
                    selectedRosterEmpId = null;
                rerenderRoster();
                showToast("Removed.", "success");
                persistDefs([asg.defId], snap);
            }

            function saveRosterNotes(defId, notes) {
                const d = defaultAssignments.find((x) => x.id === defId);
                if (!d) return;
                const old = d.notes;
                d.notes = notes;
                bgSave("updateDefaultAssignment", [defId, { notes }], {
                    revert: () => {
                        d.notes = old;
                        renderRosterDetail();
                    },
                });
            }

            // ── ROSTER DRAG-AND-DROP ──────────────────────────────────
            // Drag an employee row onto a truck row to assign. Driver-Helpers
            // default to Driver (the assign buttons still allow choosing Helper).
            function rosterEmpDragStart(e, empId) {
                e.dataTransfer.setData("text/plain", String(empId));
                e.dataTransfer.effectAllowed = "move";
            }
            function rosterTruckDragOver(e) {
                e.preventDefault();
                e.currentTarget.classList.add("cb-drop-hover");
            }
            function rosterTruckDragLeave(e) {
                e.currentTarget.classList.remove("cb-drop-hover");
            }
            function rosterTruckDrop(e, truckId) {
                e.preventDefault();
                e.currentTarget.classList.remove("cb-drop-hover");
                const empId = Number(e.dataTransfer.getData("text/plain"));
                if (!empId) return;
                selectedRosterTruckId = Number(truckId);
                selectedRosterEmpId = Number(empId);
                doAssign();
            }

            // ── OUTLETS (inline edit) ─────────────────────────────────
            function renderOutlets() {
                const q = (
                    document.getElementById("outlets-search").value || ""
                ).toLowerCase();
                const tbody = document.getElementById("outlets-tbody");
                const isAdmin = currentUser.role === "Admin";
                const filtered = outlets.filter(
                    (o) =>
                        !q ||
                        (o.outletName || "").toLowerCase().includes(q) ||
                        (o.area || "").toLowerCase().includes(q),
                );
                document.getElementById("outlets-count").textContent =
                    `${filtered.length} outlets`;
                tbody.innerHTML = filtered
                    .map((o) => {
                        const f = (field, val) =>
                            isAdmin
                                ? `<input class="cell-input" value="${esc(val)}" onchange="updateOutletField(${o.id},'${field}',this.value)">`
                                : esc(val) || "—";
                        return `<tr>
    <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">${o.id}</td>
    <td>${f("outletName", o.outletName)}</td>
    <td>${f("area", o.area)}</td>
    <td>${f("address", o.address)}</td>
    <td>${isAdmin ? f("customerGroup", o.customerGroup) : colorChip(o.customerGroup)}</td>
    <td>${
        isAdmin
            ? `<input class="cell-input" title="${esc(o.notes || "")}" value="${esc(o.notes || "")}" onchange="this.title=this.value; updateOutletField(${o.id},'notes',this.value)">`
            : esc(o.notes) || "—"
    }</td>
  </tr>`;
                    })
                    .join("");
            }

            function updateOutletField(id, field, value) {
                const o = outlets.find((x) => x.id === id);
                if (!o) return;
                if (field === "outletName" && !value.trim()) {
                    showToast("Outlet name is required.", "error");
                    renderOutlets();
                    return;
                }
                const old = o[field];
                o[field] = value;
                bgSave("updateOutlet", [id, { [field]: value }], {
                    revert: () => {
                        o[field] = old;
                        renderOutlets();
                    },
                });
            }

            function openAddOutletModal() {
                document.getElementById("no-name").value = "";
                document.getElementById("no-area").value = "";
                document.getElementById("no-address").value = "";
                document.getElementById("no-group").value = "";
                document.getElementById("no-notes").value = "";
                openModal("modal-add-outlet");
            }

            function submitAddOutlet() {
                const outletName = document
                    .getElementById("no-name")
                    .value.trim();
                const area = document.getElementById("no-area").value.trim();
                const address = document
                    .getElementById("no-address")
                    .value.trim();
                const customerGroup = document
                    .getElementById("no-group")
                    .value.trim();
                const notes = document
                    .getElementById("no-notes")
                    .value.trim();
                if (!outletName) {
                    showToast("Outlet name is required.", "error");
                    return;
                }
                setSyncing(true);
                srv()
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Add failed: " + r.error, "error");
                            return;
                        }
                        outlets.push(r.outlet);
                        closeModal("modal-add-outlet");
                        showToast(`${r.outlet.outletName} added.`, "success");
                        renderOutlets();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .createOutlet({
                        outletName,
                        area,
                        address,
                        customerGroup,
                        notes,
                    });
            }
        </script>
