<script>
            // ── TRUCK ROSTER ──────────────────────────────────────────
            function getUnassignedCrew() {
                return employees.filter(
                    (e) =>
                        e.active !== false &&
                        (e.role === "Driver" ||
                            e.role === "Helper" ||
                            e.role === "Driver-Helper") &&
                        !getEmpAssignment(e.id),
                );
            }

            function renderUnassignedCrewStat() {
                const count = getUnassignedCrew().length;
                document.getElementById("ds-unassigned-crew").textContent =
                    count;
                document.getElementById("roster-unassigned-badge").textContent =
                    count > 0 ? count : "";
            }

            function toggleTodayRoster() {
                todayRosterExpanded = !todayRosterExpanded;
                document
                    .getElementById("today-roster-section")
                    .classList.toggle("collapsed", !todayRosterExpanded);
                document
                    .getElementById("btn-toggle-roster")
                    .classList.toggle("active", todayRosterExpanded);
            }

            function renderTruckList() {
                const q = (
                    document.getElementById("truck-search").value || ""
                ).toLowerCase();
                const list = document.getElementById("truck-list");
                const filtered = trucks.filter(
                    (t) =>
                        !q ||
                        (t.plate || "").toLowerCase().includes(q) ||
                        (t.type || "").toLowerCase().includes(q) ||
                        (t.brand || "").toLowerCase().includes(q),
                );
                document.getElementById("truck-count").textContent =
                    `${filtered.length}/${trucks.length}`;
                list.innerHTML = filtered
                    .map((t) => {
                        const status = crewStatus(t.id);
                        const pipCls =
                            status === "full"
                                ? "pip-full"
                                : status === "partial"
                                  ? "pip-partial"
                                  : "pip-empty";
                        const selCls =
                            selectedRosterTruckId == t.id ? " selected" : "";
                        return `<div class="list-item${selCls}" onclick="selectRosterTruck(${t.id})">
      <span class="status-pip ${pipCls}"></span>
      <div style="min-width:0;flex:1">
        <div class="item-main">${esc(t.plate)}</div>
        <div class="item-sub">${esc(t.type)}</div>
      </div>
    </div>`;
                    })
                    .join("");
            }

            function renderEmpList() {
                const q = (
                    document.getElementById("emp-search").value || ""
                ).toLowerCase();
                const list = document.getElementById("emp-list");
                const filtered = employees.filter((e) => {
                    const matchQ =
                        !q || (e.nick || "").toLowerCase().includes(q);
                    const asgn = getEmpAssignment(e.id);
                    if (empFilter === "Driver")
                        return (
                            matchQ &&
                            (e.role === "Driver" ||
                                e.role === "Driver-Helper")
                        );
                    if (empFilter === "Helper")
                        return (
                            matchQ &&
                            (e.role === "Helper" ||
                                e.role === "Driver-Helper")
                        );
                    if (empFilter === "unassigned") return matchQ && !asgn;
                    return matchQ;
                });
                document.getElementById("emp-count-label").textContent =
                    `${filtered.length} shown`;
                list.innerHTML = filtered
                    .map((e) => {
                        const asgn = getEmpAssignment(e.id);
                        const truck = asgn
                            ? trucks.find(
                                  (t) => Number(t.id) === Number(asgn.truckId),
                              )
                            : null;
                        const isSel = selectedRosterEmpId == e.id;
                        const isDimmed = !!asgn && !isSel;
                        return `<div class="list-item${isSel ? " selected" : ""}${isDimmed ? " dimmed" : ""}" onclick="selectRosterEmp(${e.id})">
      <span class="badge ${roleBadgeClass(e.role)}">${roleBadgeAbbr(e.role)}</span>
      <div style="min-width:0;flex:1">
        <div class="item-main">${esc(e.nick)}</div>
        <div class="item-sub">${truck ? truck.plate : "Unassigned"}</div>
      </div>
    </div>`;
                    })
                    .join("");
            }

            function setEmpFilter(f, btn) {
                empFilter = f;
                btn.parentElement
                    .querySelectorAll(".pill")
                    .forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
                renderEmpList();
            }

            function renderRosterDetail() {
                const body = document.getElementById("roster-detail-body");
                const bar = document.getElementById("roster-assign-bar");
                const btn = document.getElementById("roster-assign-btn");
                const btn2 = document.getElementById("roster-assign-btn2");
                const hint = document.getElementById("roster-assign-hint");

                if (!selectedRosterTruckId) {
                    body.innerHTML = `<div class="empty-board" style="padding:24px 0"><div class="icon">🚚</div><div class="sub">Select a truck to view its crew</div></div>`;
                    bar.style.display = "none";
                    return;
                }
                bar.style.display = "";
                const t = trucks.find(
                    (t) => Number(t.id) === Number(selectedRosterTruckId),
                );
                const crew = getRosterCrew(selectedRosterTruckId);
                const driver = crew.find((a) => a.type === "Driver");
                const helpers = crew.filter((a) => a.type === "Helper");

                let html = `<div class="detail-plate">${esc(t.plate)}</div>
              <div class="detail-type">${esc(t.brand)} · ${esc(t.type)}</div>
              <div class="section-lbl">Driver</div>`;
                if (driver) {
                    const em = employees.find(
                        (e) => Number(e.id) === Number(driver.employeeId),
                    );
                    html += `<div class="crew-item"><span class="badge badge-driver">Driver</span><span class="crew-item-name">${esc(em?.nick || "?")}</span>
             <button class="remove-btn" onclick="doRosterRemove(${driver.employeeId},'Driver')">Remove</button></div>`;
                } else {
                    html += `<div style="font-size:11px;color:var(--hint);font-style:italic;padding:3px 0">No driver assigned</div>`;
                }
                html += `<div class="section-lbl">Helpers (${helpers.length})</div>`;
                if (helpers.length > 0) {
                    helpers.forEach((h) => {
                        const em = employees.find(
                            (e) => Number(e.id) === Number(h.employeeId),
                        );
                        html += `<div class="crew-item"><span class="badge badge-helper">Helper</span><span class="crew-item-name">${esc(em?.nick || "?")}</span>
               <button class="remove-btn" onclick="doRosterRemove(${h.employeeId},'Helper')">Remove</button></div>`;
                    });
                } else {
                    html += `<div style="font-size:11px;color:var(--hint);font-style:italic;padding:3px 0">No helpers assigned</div>`;
                }
                body.innerHTML = html;

                if (selectedRosterEmpId) {
                    const em = employees.find(
                        (e) => Number(e.id) === Number(selectedRosterEmpId),
                    );
                    const existingAssignment = crew.find(
                        (a) =>
                            Number(a.employeeId) ===
                            Number(selectedRosterEmpId),
                    );
                    btn2.style.display = "none";
                    if (existingAssignment) {
                        btn.textContent = `Remove ${em.nick}`;
                        btn.className = "assign-btn";
                        btn.style.background = "var(--red-bg)";
                        btn.style.color = "var(--red)";
                        btn.onclick = () => doAssign();
                        hint.textContent = "";
                    } else if (em.role === "Driver-Helper") {
                        btn.textContent = `Assign as Driver → ${t.plate}`;
                        btn.className = "assign-btn primary";
                        btn.style.background = "";
                        btn.style.color = "";
                        btn.onclick = () => doAssign("Driver");
                        btn2.textContent = `Assign as Helper → ${t.plate}`;
                        btn2.className = "assign-btn primary";
                        btn2.style.display = "";
                        btn2.onclick = () => doAssign("Helper");
                        const existing = getEmpAssignment(em.id);
                        hint.textContent = existing
                            ? `Will move from ${trucks.find((t) => Number(t.id) === Number(existing.truckId))?.plate}`
                            : "";
                    } else {
                        btn.textContent = `Assign ${em.nick} → ${t.plate}`;
                        btn.className = "assign-btn primary";
                        btn.style.background = "";
                        btn.style.color = "";
                        btn.onclick = () => doAssign(em.role);
                        const existing = getEmpAssignment(em.id);
                        hint.textContent = existing
                            ? `Will move from ${trucks.find((t) => Number(t.id) === Number(existing.truckId))?.plate}`
                            : "";
                    }
                } else {
                    btn.textContent = "Assign employee";
                    btn.className = "assign-btn disabled";
                    btn.style.background = "";
                    btn.style.color = "";
                    btn.onclick = () => doAssign();
                    btn2.style.display = "none";
                    hint.textContent = "Select an employee from the list →";
                }
            }

            function selectRosterTruck(id) {
                selectedRosterTruckId = Number(id);
                selectedRosterEmpId = null;
                renderTruckList();
                renderEmpList();
                renderRosterDetail();
            }
            function selectRosterEmp(id) {
                if (!selectedRosterTruckId) {
                    showToast("Select a truck first.");
                    return;
                }
                selectedRosterEmpId =
                    selectedRosterEmpId == id ? null : Number(id);
                renderEmpList();
                renderRosterDetail();
            }

            function _patchRosterAssignment(row) {
                const idx = rosterAssignments.findIndex(
                    (a) => Number(a.employeeId) === Number(row.employeeId),
                );
                if (idx >= 0) rosterAssignments[idx] = row;
                else rosterAssignments.push(row);
                renderTruckList();
                renderEmpList();
                renderRosterDetail();
                renderUnassignedCrewStat();
            }

            function doAssign(type) {
                if (saving || !selectedRosterTruckId || !selectedRosterEmpId)
                    return;
                const em = employees.find(
                    (e) => Number(e.id) === Number(selectedRosterEmpId),
                );
                const t = trucks.find(
                    (t) => Number(t.id) === Number(selectedRosterTruckId),
                );
                const crew = getRosterCrew(selectedRosterTruckId);
                const existingAssignment = crew.find(
                    (a) => Number(a.employeeId) === Number(selectedRosterEmpId),
                );
                if (existingAssignment) {
                    doRosterRemove(selectedRosterEmpId, existingAssignment.type);
                    return;
                }

                const assignType = type || em.role;

                const existing = getEmpAssignment(em.id);
                if (
                    existing &&
                    !confirm(
                        `${em.nick} is on ${trucks.find((t) => Number(t.id) === Number(existing.truckId))?.plate}. Move to ${t.plate}?`,
                    )
                )
                    return;
                if (assignType === "Driver") {
                    const d = crew.find((a) => a.type === "Driver");
                    if (
                        d &&
                        !confirm(
                            `${t.plate} already has driver ${employees.find((e) => Number(e.id) === Number(d.employeeId))?.nick}. Replace?`,
                        )
                    )
                        return;
                }

                saving = true;
                setSyncing(true);
                srv()
                    .withSuccessHandler((r) => {
                        saving = false;
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Save failed: " + r.error, "error");
                            return;
                        }
                        showToast(`${em.nick} → ${t.plate}`, "success");
                        selectedRosterEmpId = null;
                        _patchRosterAssignment(r.row);
                    })
                    .withFailureHandler((e) => {
                        saving = false;
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .saveAssignment(em.id, t.id, assignType);
            }

            function doRosterRemove(empId, type) {
                if (
                    !confirm(
                        `Remove this ${type.toLowerCase()} from their truck?`,
                    )
                )
                    return;
                saving = true;
                setSyncing(true);
                srv()
                    .withSuccessHandler((r) => {
                        saving = false;
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Remove failed: " + r.error, "error");
                            return;
                        }
                        showToast("Removed.", "success");
                        if (selectedRosterEmpId == empId)
                            selectedRosterEmpId = null;
                        _patchRosterAssignment(r.row);
                    })
                    .withFailureHandler((e) => {
                        saving = false;
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .removeAssignment(empId, type);
            }

            // ── OUTLETS (inline edit) ─────────────────────────────────
            function renderOutlets() {
                const q = (
                    document.getElementById("outlets-search").value || ""
                ).toLowerCase();
                const tbody = document.getElementById("outlets-tbody");
                const isAdmin = currentUser.role === "Admin";
                const filtered = outlets.filter(
                    (o) =>
                        !q ||
                        (o.outletName || "").toLowerCase().includes(q) ||
                        (o.area || "").toLowerCase().includes(q),
                );
                document.getElementById("outlets-count").textContent =
                    `${filtered.length} outlets`;
                tbody.innerHTML = filtered
                    .map((o) => {
                        const f = (field, val) =>
                            isAdmin
                                ? `<input class="cell-input" value="${esc(val)}" onchange="updateOutletField(${o.id},'${field}',this.value)">`
                                : esc(val) || "—";
                        return `<tr>
    <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">${o.id}</td>
    <td>${f("outletName", o.outletName)}</td>
    <td>${f("area", o.area)}</td>
    <td>${f("address", o.address)}</td>
    <td>${isAdmin ? f("customerGroup", o.customerGroup) : colorChip(o.customerGroup)}</td>
    <td>${
        isAdmin
            ? `<input class="cell-input" title="${esc(o.notes || "")}" value="${esc(o.notes || "")}" onchange="updateOutletField(${o.id},'notes',this.value)">`
            : esc(o.notes) || "—"
    }</td>
  </tr>`;
                    })
                    .join("");
            }

            function updateOutletField(id, field, value) {
                const o = outlets.find((x) => x.id === id);
                if (!o) return;
                if (field === "outletName" && !value.trim()) {
                    showToast("Outlet name is required.", "error");
                    renderOutlets();
                    return;
                }
                const old = o[field];
                o[field] = value;
                bgSave("updateOutlet", [id, { [field]: value }], {
                    revert: () => {
                        o[field] = old;
                        renderOutlets();
                    },
                });
            }

            function openAddOutletModal() {
                document.getElementById("no-name").value = "";
                document.getElementById("no-area").value = "";
                document.getElementById("no-address").value = "";
                document.getElementById("no-group").value = "";
                document.getElementById("no-notes").value = "";
                openModal("modal-add-outlet");
            }

            function submitAddOutlet() {
                const outletName = document
                    .getElementById("no-name")
                    .value.trim();
                const area = document.getElementById("no-area").value.trim();
                const address = document
                    .getElementById("no-address")
                    .value.trim();
                const customerGroup = document
                    .getElementById("no-group")
                    .value.trim();
                const notes = document
                    .getElementById("no-notes")
                    .value.trim();
                if (!outletName) {
                    showToast("Outlet name is required.", "error");
                    return;
                }
                setSyncing(true);
                srv()
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Add failed: " + r.error, "error");
                            return;
                        }
                        outlets.push(r.outlet);
                        closeModal("modal-add-outlet");
                        showToast(`${r.outlet.outletName} added.`, "success");
                        renderOutlets();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .createOutlet({
                        outletName,
                        area,
                        address,
                        customerGroup,
                        notes,
                    });
            }

            // ── DEFAULT ASSIGNMENTS (inline edit) ─────────────────────
            // Options for a default-crew <select>; `roles` picks Driver vs
            // Helper eligible employees, `selectedIds` marks the chosen ones.
            function crewSelectOptions(roles, selectedIds) {
                const selSet = new Set((selectedIds || []).map(Number));
                return employees
                    .filter(
                        (e) => roles.includes(e.role) && e.active !== false,
                    )
                    .map(
                        (e) =>
                            `<option value="${e.id}" ${selSet.has(Number(e.id)) ? "selected" : ""}>${esc(e.nick)}</option>`,
                    )
                    .join("");
            }

            function renderDefaults() {
                const q = (
                    document.getElementById("defaults-search").value || ""
                ).toLowerCase();
                const tbody = document.getElementById("defaults-tbody");
                const isAdmin = currentUser.role === "Admin";

                const truckMap = indexById(trucks);
                const empMap = indexById(employees);

                const filtered = defaultAssignments.filter((d) => {
                    const truck = truckMap[d.truckId] || {};
                    const driver = empMap[d.defaultDriverId] || {};
                    return (
                        !q ||
                        (truck.plate || "").toLowerCase().includes(q) ||
                        (driver.nick || "").toLowerCase().includes(q)
                    );
                });

                document.getElementById("defaults-count").textContent =
                    `${filtered.length} trucks`;

                tbody.innerHTML = filtered
                    .map((d) => {
                        const truck = truckMap[d.truckId] || {};
                        const driverSel = isAdmin
                            ? `<select class="cell-select" onchange="updateDefaultDriver(${d.id}, this.value)"><option value="">— None —</option>${crewSelectOptions(["Driver", "Driver-Helper"], d.defaultDriverId != null ? [d.defaultDriverId] : [])}</select>`
                            : (empMap[d.defaultDriverId] || {}).nick || "None";
                        const helperSel = isAdmin
                            ? `<div class="chk-list">${helperCheckboxes(d.id, d.defaultHelperIds || [])}</div>`
                            : (d.defaultHelperIds || [])
                                  .map((h) => (empMap[h] || {}).nick)
                                  .filter(Boolean)
                                  .join(", ") || "None";

                        const today = getTodaysCrew(d.truckId);
                        const todayDriver = today.driverId
                            ? empMap[today.driverId]
                            : null;
                        const todayHelperNicks = today.helperIds
                            .map((hid) => empMap[hid]?.nick || `ID:${hid}`)
                            .join(", ");
                        const todayParts = [];
                        if (todayDriver)
                            todayParts.push(
                                `<span style="font-weight:500">${esc(todayDriver.nick)}</span>`,
                            );
                        if (todayHelperNicks)
                            todayParts.push(esc(todayHelperNicks));
                        const todayCrewHtml = todayParts.length
                            ? todayParts.join(" + ")
                            : '<span style="color:var(--hint);font-style:italic">Unassigned</span>';

                        const defDriverId =
                            d.defaultDriverId != null
                                ? Number(d.defaultDriverId)
                                : null;
                        const defHelperSet = new Set(
                            (d.defaultHelperIds || []).map(Number),
                        );
                        const todayHelperSet = new Set(today.helperIds);
                        const isSub =
                            defDriverId !== today.driverId ||
                            defHelperSet.size !== todayHelperSet.size ||
                            [...defHelperSet].some(
                                (id) => !todayHelperSet.has(id),
                            );
                        const subBadge = isSub
                            ? '<span class="sub-badge">Sub</span>'
                            : "";

                        const notesCell = isAdmin
                            ? `<input class="cell-input" title="${esc(d.notes || "")}" value="${esc(d.notes || "")}" placeholder="notes…" onchange="saveDefNotes(${d.id}, this.value)">`
                            : esc(d.notes || "");

                        return `<tr>
      <td style="font-family:'DM Mono',monospace;font-weight:500">${esc(truck.plate || "—")}</td>
      <td style="font-size:11px;color:var(--muted)">${esc(truck.type || "—")}</td>
      <td>${driverSel}</td>
      <td>${helperSel}</td>
      <td style="font-size:11px;cursor:pointer" onclick="goToTodaysRoster(${d.truckId})" title="View / edit today's roster for this truck">${todayCrewHtml}${subBadge}</td>
      <td style="font-size:11px;color:var(--muted)">${notesCell}</td>
    </tr>`;
                    })
                    .join("");
            }

            function updateDefaultDriver(defId, driverIdRaw) {
                const d = defaultAssignments.find((x) => x.id === defId);
                if (!d) return;
                const driverId = Number(driverIdRaw) || null;
                const old = d.defaultDriverId;
                d.defaultDriverId = driverId;
                renderDefaults();
                bgSave(
                    "updateDefaultAssignment",
                    [defId, { defaultDriverId: driverId }],
                    {
                        revert: () => {
                            d.defaultDriverId = old;
                            renderDefaults();
                        },
                    },
                );
            }

            // Checkbox list of eligible helpers — far easier to pick than a
            // ctrl-click <select multiple>.
            function helperCheckboxes(defId, selectedIds) {
                const sel = new Set((selectedIds || []).map(Number));
                return employees
                    .filter(
                        (e) =>
                            ["Helper", "Driver-Helper"].includes(e.role) &&
                            e.active !== false,
                    )
                    .map(
                        (e) =>
                            `<label class="chk"><input type="checkbox" value="${e.id}" ${sel.has(Number(e.id)) ? "checked" : ""} onchange="toggleDefaultHelper(${defId}, this)">${esc(e.nick)}</label>`,
                    )
                    .join("");
            }

            function toggleDefaultHelper(defId, cb) {
                const d = defaultAssignments.find((x) => x.id === defId);
                if (!d) return;
                const cur = new Set((d.defaultHelperIds || []).map(Number));
                const id = Number(cb.value);
                if (cb.checked) cur.add(id);
                else cur.delete(id);
                if (cur.size > 2) {
                    showToast(
                        "A truck can have at most 2 default helpers.",
                        "warning",
                    );
                    cb.checked = false;
                    return;
                }
                const old = d.defaultHelperIds || [];
                const ids = [...cur];
                d.defaultHelperIds = ids;
                renderDefaults();
                bgSave(
                    "updateDefaultAssignment",
                    [defId, { defaultHelperIds: ids }],
                    {
                        revert: () => {
                            d.defaultHelperIds = old;
                            renderDefaults();
                        },
                    },
                );
            }

            function saveDefNotes(defId, notes) {
                const d = defaultAssignments.find((x) => x.id === defId);
                if (!d) return;
                const old = d.notes;
                d.notes = notes;
                bgSave("updateDefaultAssignment", [defId, { notes }], {
                    revert: () => {
                        d.notes = old;
                        renderDefaults();
                    },
                });
            }

            // ── ROSTER HELPERS ────────────────────────────────────────
            function getRosterCrew(truckId) {
                return (rosterAssignments || []).filter(
                    (a) =>
                        a.truckId !== null &&
                        Number(a.truckId) === Number(truckId),
                );
            }
            function getEmpAssignment(empId) {
                return (rosterAssignments || []).find(
                    (a) =>
                        a.truckId !== null &&
                        Number(a.employeeId) === Number(empId),
                );
            }
            function crewStatus(truckId) {
                const crew = getRosterCrew(truckId);
                const hasD = crew.some((a) => a.type === "Driver");
                const hasH = crew.some((a) => a.type === "Helper");
                if (hasD && hasH) return "full";
                if (hasD || hasH) return "partial";
                return "empty";
            }
            function getTodaysCrew(truckId) {
                const crew = getRosterCrew(truckId);
                const driver = crew.find((a) => a.type === "Driver");
                const helpers = crew.filter((a) => a.type === "Helper");
                return {
                    driverId: driver ? Number(driver.employeeId) : null,
                    helperIds: helpers.map((h) => Number(h.employeeId)),
                };
            }
            function goToTodaysRoster(truckId) {
                switchPanel("dispatch");
                if (!todayRosterExpanded) toggleTodayRoster();
                selectRosterTruck(truckId);
                document
                    .getElementById("today-roster-section")
                    .scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        </script>
