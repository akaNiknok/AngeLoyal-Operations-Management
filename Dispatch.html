<script>
            // ── DISPATCH BOARD ────────────────────────────────────────
            function loadDispatch() {
                const dateVal = document.getElementById("dispatch-date").value;
                if (!dateVal) return;
                setSyncing(true);
                srv()
                    .withSuccessHandler((data) => {
                        dispatchData = data;
                        renderDispatch();
                        if (selectedTripId) renderSidebar();
                        setSyncing(false);
                    })
                    .withFailureHandler((e) => {
                        showToast(
                            "Dispatch load failed: " + e.message,
                            "error",
                        );
                        setSyncing(false);
                    })
                    .getDispatchBoardData(isoToMDY(dateVal));
            }

            function renderDispatch() {
                if (!dispatchData) return;
                const trips = getFilteredTrips();

                const outletMap = indexById(outlets);
                const empMap = indexById(employees);
                const truckMap = indexById(trucks);

                // Stats (always computed from full data, not filtered)
                const all = dispatchData.trips || [];
                document.getElementById("ds-total").textContent = all.length;
                const preppingCount = all.filter(
                    (t) => t.tripStatus === "Prepping",
                ).length;
                document.getElementById("ds-prepping").textContent =
                    preppingCount;
                document.getElementById("btn-mark-scheduled").style.display =
                    canEdit() && preppingCount > 0 ? "" : "none";
                document.getElementById("ds-scheduled").textContent =
                    all.filter((t) => t.tripStatus === "Scheduled").length;
                document.getElementById("ds-delivered").textContent =
                    all.filter((t) => t.tripStatus === "Delivered").length;
                document.getElementById("ds-undelivered").textContent =
                    all.filter((t) =>
                        [
                            "Undelivered",
                            "Foul Trip - No Redeliver",
                            "Foul Trip - For Redeliver",
                        ].includes(t.tripStatus),
                    ).length;
                const noWb = all.filter(
                    (t) => !t.waybillSuggested && !t.waybillConfirmed,
                ).length;
                document.getElementById("ds-nowb").textContent = noWb;
                renderUnassignedCrewStat();

                // Table
                const empty = document.getElementById("dispatch-empty");
                const table = document.getElementById("dispatch-table");

                if (trips.length === 0) {
                    empty.style.display = "";
                    table.style.display = "none";
                    empty.querySelector(".msg").textContent =
                        all.length === 0
                            ? "No trips for this date"
                            : "No trips match the current filter";
                    empty.querySelector(".sub").textContent =
                        all.length === 0
                            ? "Import a Rebisco route file or add a manual trip."
                            : "Change the filter above to see other trips.";
                    return;
                }

                empty.style.display = "none";
                table.style.display = "";

                const tbody = document.getElementById("dispatch-tbody");

                // Alternating shade per FO so all trips of one Freight Order
                // (even when split across several trucks/waybills) read as one
                // visual group. Parity flips only when the FO changes between
                // adjacent rows.
                let foParity = 0;
                let prevFoKey = null;
                const foGroupCls = trips.map((t) => {
                    const key = t.foNumber ? "fo-" + t.foNumber : "none-" + t.id;
                    if (prevFoKey !== null && key !== prevFoKey)
                        foParity ^= 1;
                    prevFoKey = key;
                    return "fo-grp-" + foParity;
                });

                tbody.innerHTML = trips
                    .map((t, i) => {
                        const sourceCls =
                            t.source === "Manual"
                                ? "source-manual"
                                : t.source === "Carry-over"
                                  ? "source-carryover"
                                  : "";
                        const selCls =
                            t.id === selectedTripId ? "selected" : "";

                        const statusCls = statusChipClass(t.tripStatus);
                        const statusLabel = shortStatus(t.tripStatus);

                        const outletName = (outletMap[t.outletId] || {}).outletName || "";
                        const truckPlate = (truckMap[t.truckId] || {}).plate || "";
                        const assignedTruckBillingCat = (truckMap[t.truckId] || {}).billingCategory || "";
                        const driverNick = (empMap[t.driverId] || {}).nick || "";
                        const helperDetails = (t.helperIds || [])
                            .map((hid) => empMap[hid])
                            .filter(Boolean);

                        const driverHtml = driverNick
                            ? `<div class="crew-cell">
           <span class="crew-driver">${esc(driverNick)}</span>
           ${helperDetails.length ? `<span class="crew-helper">${esc(helperDetails.map((h) => h.nick).join(", "))}</span>` : ""}
         </div>`
                            : `<span class="crew-empty">Unassigned</span>`;

                        let wbHtml = '<span class="wb-none">—</span>';
                        if (t.waybillConfirmed) {
                            wbHtml = `<span class="wb-confirmed">${esc(t.waybillConfirmed)}</span>`;
                        } else if (t.waybillSuggested) {
                            wbHtml = `<span class="wb-suggested">${esc(t.waybillSuggested)}</span>`;
                        }

                        const billingCat = t.truckBillingCategory || "";
                        const foFull =
                            t.foNumber +
                            (t.foSplitSuffix ? "-" + t.foSplitSuffix : "");

                        return `<tr class="${sourceCls} ${selCls} ${foGroupCls[i]}" onclick="selectTrip(${t.id})">
      <td class="td-fo">${esc(foFull) || "—"}</td>
      <td class="td-outlet" title="${esc(outletName)}">${esc(outletName) || "—"}</td>
      <td class="td-area">${esc(t.area) || "—"}</td>
      <td class="td-qty">${t.quantity || "—"}</td>
      <td class="td-qty">${t.cbm || "—"}</td>
      <td>${esc(t.tier) || "—"}</td>
      <td><span class="status-chip sc-scheduled" style="background:var(--border);color:var(--muted);padding:1px 6px">${esc(billingCat) || "—"}</span></td>
      <td class="td-plate col-divider">${esc(truckPlate) || "—"}</td>
      <td><span class="status-chip sc-scheduled" style="background:var(--border);color:var(--muted);padding:1px 6px">${esc(assignedTruckBillingCat) || "—"}</span></td>
      <td>${driverHtml}</td>
      <td class="col-divider"><span class="status-chip ${statusCls}">${statusLabel}</span></td>
      <td class="td-wb">${wbHtml}</td>
      <td><span style="font-size:10px;color:var(--hint)">${esc(t.source)}</span></td>
    </tr>`;
                    })
                    .join("");
            }

            function getFilteredTrips() {
                if (!dispatchData) return [];
                const trips = dispatchData.trips || [];
                if (statusFilter === "all") return trips;
                if (statusFilter === "carry")
                    return trips.filter((t) => t.source === "Carry-over");
                return trips.filter((t) => t.tripStatus === statusFilter);
            }

            function setStatusFilter(f, btn) {
                statusFilter = f;
                document
                    .querySelectorAll("#status-pills .pill")
                    .forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
                renderDispatch();
            }

            function shiftDate(delta) {
                const inp = document.getElementById("dispatch-date");
                const d = new Date(inp.value + "T00:00:00");
                d.setDate(d.getDate() + delta);
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, "0");
                const dd = String(d.getDate()).padStart(2, "0");
                inp.value = `${yyyy}-${mm}-${dd}`;
                loadDispatch();
            }

            function goToday() {
                document.getElementById("dispatch-date").value = todayStr();
                loadDispatch();
            }

            // ── TRIP SELECTION & SIDEBAR ──────────────────────────────
            function selectTrip(id) {
                if (selectedTripId === id) {
                    closeSidebar();
                    return;
                }
                selectedTripId = id;
                renderDispatch(); // re-highlight row
                renderSidebar();
                document.getElementById("trip-sidebar").style.display = "";
            }

            function closeSidebar() {
                selectedTripId = null;
                document.getElementById("trip-sidebar").style.display = "none";
                renderDispatch();
            }

            function renderSidebar() {
                if (!selectedTripId || !dispatchData) return;
                const trip = (dispatchData.trips || []).find(
                    (t) => t.id === selectedTripId,
                );
                if (!trip) return;

                const outletMap = indexById(outlets);
                const outletName = (outletMap[trip.outletId] || {}).outletName || "";

                document.getElementById("sb-title").textContent =
                    outletName || `Trip #${trip.id}`;

                const foFull =
                    trip.foNumber +
                    (trip.foSplitSuffix ? "-" + trip.foSplitSuffix : "");

                let bodyHtml = `
    <div class="field-group">
      <div class="field-label">FO Number</div>
      <div class="field-value mono">${esc(foFull) || "—"}</div>
    </div>
    <div class="field-group">
      <div class="field-label">Outlet</div>
      <div class="field-value">${esc(outletName) || "—"}</div>
      <div class="field-value muted" style="font-size:11px">${esc(trip.area) || ""}</div>
    </div>
    <div class="field-group" style="display:flex;gap:16px">
      <div>
        <div class="field-label">Qty</div>
        <div class="field-value mono">${trip.quantity || "—"}</div>
      </div>
      <div>
        <div class="field-label">CBM</div>
        <div class="field-value mono">${trip.cbm || "—"}</div>
      </div>
      <div>
        <div class="field-label">Type</div>
        <div class="field-value mono">${esc(trip.truckBillingCategory) || "—"}</div>
      </div>
    </div>

    <hr style="border:none;border-top:1px solid var(--border);margin:10px 0">

    <div class="field-label">Assign truck</div>
    <div class="assign-row" style="margin-bottom:10px">
      <select id="sb-truck" onchange="handleSbTruckChange()">${truckOptions(trip.truckId)}</select>
    </div>

    <div class="field-label">Assign driver</div>
    <div class="assign-row" style="margin-bottom:10px">
      <select id="sb-driver">${driverOptions(trip.driverId)}</select>
    </div>

    <div class="field-label">Helper(s)</div>
    <div class="assign-row" style="margin-bottom:10px">
      <select id="sb-helper" multiple size="3" onchange="enforceHelperCap(this)">${helperOptions(trip.helperIds)}</select>
    </div>

    <hr style="border:none;border-top:1px solid var(--border);margin:10px 0">

    <div class="field-label">Trip status</div>
    <div class="status-select-grid">
      ${statusOptions(trip.tripStatus)}
    </div>

    <div style="margin-top:10px">
      <div class="field-label">Remarks</div>
      <textarea class="remarks-area" id="sb-remarks">${esc(trip.remarks || "")}</textarea>
    </div>

    <hr style="border:none;border-top:1px solid var(--border);margin:10px 0">

    <div class="field-label">Waybill</div>
    ${waybillSectionHtml(trip)}

    <div style="margin-top:4px;font-size:10px;color:var(--hint)">
      Added: ${esc(trip.addedAt || "")}<br>
      By: ${esc(trip.addedBy || "")}
      ${trip.parentTripId ? `<br>Carry-over from Trip #${trip.parentTripId}` : ""}
    </div>
  `;

                document.getElementById("sb-body").innerHTML = bodyHtml;

                // Footer save button
                const canE = canEdit();
                document.getElementById("sb-footer").innerHTML = canE
                    ? `<button class="btn btn-primary" style="width:100%" onclick="saveSidebar(${trip.id})">Save changes</button>
       <button class="btn btn-danger btn-sm" style="width:100%;margin-top:2px" onclick="confirmDeleteTrip(${trip.id})" ${trip.source !== "Import" ? 'style="display:none"' : ""}>Remove this trip</button>`
                    : `<div style="font-size:11px;color:var(--hint);text-align:center">View only — your role cannot edit trips.</div>`;
            }

            function waybillSectionHtml(trip) {
                if (trip.waybillConfirmed) {
                    return `<div class="field-value mono wb-confirmed">${esc(trip.waybillConfirmed)}</div>
            <div style="font-size:10px;color:var(--green);margin-top:3px">✓ Confirmed</div>`;
                }
                const suggested = trip.waybillSuggested || "";
                const prefixOpts = waybillPrefixes
                    .map(
                        (p) =>
                            `<option value="${p.id}" ${suggested.startsWith(p.prefix) ? "selected" : ""}>${esc(p.prefix)} — ${esc(p.companyName)}</option>`,
                    )
                    .join("");
                const canConfirm = canEdit() && !!trip.suggestedWaybillId;
                return `<div class="wb-confirm-row">
    <input type="text" id="sb-wb-number" value="${esc(suggested)}" placeholder="e.g. AY-10761" style="font-family:'DM Mono',monospace;font-size:12px">
    <button class="btn btn-ghost btn-sm" onclick="confirmWaybillFromSidebar(${trip.id})" ${canConfirm ? "" : "disabled"}>Confirm</button>
  </div>
  <div style="font-size:10px;color:var(--hint);margin-top:3px">${suggested ? "Suggested — edit if needed, then confirm to lock." : "No waybill suggested yet."}</div>`;
            }

            function statusOptions(current) {
                const opts = [
                    ["Prepping", "sc-prepping", "Prepping"],
                    ["Scheduled", "sc-scheduled", "Scheduled"],
                    ["Delivered", "sc-delivered", "Delivered"],
                    ["Undelivered", "sc-undelivered", "Undelivered"],
                    ["Foul Trip - No Redeliver", "sc-fouln", "Foul – No RD"],
                    ["Foul Trip - For Redeliver", "sc-foutr", "Foul – For RD"],
                    ["Redeliver", "sc-redeliver", "Redeliver"],
                    ["Two-Day Trip", "sc-twoday", "Two-Day"],
                ];
                return opts
                    .map(
                        ([val, cls, lbl]) =>
                            `<div class="status-option ${cls} ${current === val ? "active" : ""}" onclick="selectStatusOption(this,'${val}')">${lbl}</div>`,
                    )
                    .join("");
            }

            function selectStatusOption(el, val) {
                document
                    .querySelectorAll(".status-option")
                    .forEach((o) => o.classList.remove("active"));
                el.classList.add("active");
                // Show warning for carry-over statuses
                const warnEl = document.getElementById("sb-carryover-warn");
                const isCarry =
                    val === "Foul Trip - For Redeliver" || val === "Redeliver";
                if (warnEl) warnEl.style.display = isCarry ? "" : "none";
            }

            function truckOptions(selectedId) {
                const opts = trucks
                    .filter((t) => t.active !== false)
                    .map(
                        (t) =>
                            `<option value="${t.id}" ${Number(t.id) === Number(selectedId) ? "selected" : ""}>${esc(t.plate)} — ${esc(t.type)}</option>`,
                    )
                    .join("");
                return `<option value="">— Unassigned —</option>${opts}`;
            }

            function driverOptions(selectedId) {
                const opts = employees
                    .filter(
                        (e) =>
                            (e.role === "Driver" ||
                                e.role === "Driver-Helper") &&
                            e.active !== false,
                    )
                    .map(
                        (e) =>
                            `<option value="${e.id}" ${Number(e.id) === Number(selectedId) ? "selected" : ""}>${esc(e.nick)}</option>`,
                    )
                    .join("");
                return `<option value="">— Unassigned —</option>${opts}`;
            }

            function helperOptions(selectedIds) {
                const selSet = new Set((selectedIds || []).map(Number));
                return employees
                    .filter(
                        (e) =>
                            (e.role === "Helper" ||
                                e.role === "Driver-Helper") &&
                            e.active !== false,
                    )
                    .map(
                        (e) =>
                            `<option value="${e.id}" ${selSet.has(Number(e.id)) ? "selected" : ""}>${esc(e.nick)}</option>`,
                    )
                    .join("");
            }

            // Trips carry at most 2 helpers — drop the oldest extra selection.
            function enforceHelperCap(sel) {
                const selected = Array.from(sel.selectedOptions);
                if (selected.length > 2) {
                    selected[0].selected = false;
                    showToast("A trip can have at most 2 helpers.", "warning");
                }
            }

            function handleSbTruckChange() {
                // When truck changes, pre-fill driver from Default Assignments
                const truckId = Number(
                    document.getElementById("sb-truck").value,
                );
                if (!truckId) return;
                const def = defaultAssignments.find(
                    (d) => Number(d.truckId) === truckId,
                );
                if (!def) return;
                const driverSel = document.getElementById("sb-driver");
                if (driverSel && def.defaultDriverId) {
                    driverSel.value = def.defaultDriverId;
                }
            }

            function saveSidebar(tripId) {
                if (!canEdit() || saving) return;
                const trip = (dispatchData.trips || []).find(
                    (t) => t.id === tripId,
                );
                if (!trip) return;

                const newTruckId =
                    Number(document.getElementById("sb-truck").value) || null;
                const newDriverId =
                    Number(document.getElementById("sb-driver").value) || null;
                const newHelperIds = Array.from(
                    document.getElementById("sb-helper").selectedOptions,
                )
                    .map((o) => Number(o.value))
                    .filter(Boolean);
                const newRemarks = document.getElementById("sb-remarks").value;
                const activeStatusEl = document.querySelector(
                    ".status-option.active",
                );
                const newStatus = activeStatusEl
                    ? activeStatusEl.textContent.trim()
                    : null;

                // Map short labels back to full status values
                const statusMap = {
                    Prepping: "Prepping",
                    Scheduled: "Scheduled",
                    Delivered: "Delivered",
                    Undelivered: "Undelivered",
                    "Foul – No RD": "Foul Trip - No Redeliver",
                    "Foul – For RD": "Foul Trip - For Redeliver",
                    Redeliver: "Redeliver",
                    "Two-Day": "Two-Day Trip",
                };
                const fullStatus = statusMap[newStatus] || newStatus;

                // Check for duplicate driver assignment
                const driverConflict =
                    newDriverId &&
                    (dispatchData.trips || []).some(
                        (t) =>
                            t.id !== tripId &&
                            t.driverId === newDriverId &&
                            !["Delivered", "Foul Trip - No Redeliver"].includes(
                                t.tripStatus,
                            ),
                    );
                if (driverConflict) {
                    const d = employees.find(
                        (e) => Number(e.id) === newDriverId,
                    );
                    const outletMap = indexById(outlets);
                    const conflict = (dispatchData.trips || []).find(
                        (t) => t.id !== tripId && t.driverId === newDriverId,
                    );
                    const conflictOutlet = conflict
                        ? (outletMap[conflict.outletId] || {}).outletName
                        : "";
                    if (
                        !confirm(
                            `⚠ ${d?.nick || "This driver"} is already assigned to "${conflictOutlet || "another trip"}". Assign anyway?`,
                        )
                    )
                        return;
                }

                saving = true;
                setSyncing(true);

                const changes = {
                    truckId: newTruckId,
                    driverId: newDriverId,
                    helperIds: newHelperIds,
                    tripStatus: fullStatus,
                    remarks: newRemarks,
                };

                srv()
                    .withSuccessHandler((r) => {
                        saving = false;
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Save failed: " + r.error, "error");
                            return;
                        }
                        Object.assign(trip, r.trip);
                        if (r.routeFrequencyWarning) {
                            showToast(
                                `⚠ Driver assigned to ${r.routeFrequencyWarning.outletName} ${r.routeFrequencyWarning.count}× in last 21 days`,
                                "warning",
                            );
                        }
                        if (r.newTripId) {
                            showToast(
                                `Carry-over trip created for next day (ID ${r.newTripId}).`,
                                "success",
                            );
                        }
                        if (!r.routeFrequencyWarning && !r.newTripId) {
                            showToast("Saved.", "success");
                        }
                        renderDispatch();
                        renderSidebar();
                    })
                    .withFailureHandler((e) => {
                        saving = false;
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .saveTripChanges(tripId, changes);
            }

            function confirmWaybillFromSidebar(tripId) {
                if (!canEdit()) return;
                const wbInput = document.getElementById("sb-wb-number");
                if (!wbInput) return;
                const customNumber = wbInput.value.trim();
                if (!customNumber) {
                    showToast("Enter a waybill number first.", "warning");
                    return;
                }

                const trip = (dispatchData.trips || []).find(
                    (t) => t.id === tripId,
                );
                if (!trip) return;
                if (!trip.suggestedWaybillId) {
                    showToast(
                        "No waybill to confirm for this trip yet.",
                        "warning",
                    );
                    return;
                }

                setSyncing(true);
                srv()
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast(
                                "Waybill confirm failed: " + r.error,
                                "error",
                            );
                            return;
                        }
                        trip.waybillConfirmed = r.waybillNumber;
                        trip.waybillSuggested = "";
                        trip.suggestedWaybillId = null;
                        showToast(
                            `Waybill ${r.waybillNumber} confirmed.`,
                            "success",
                        );
                        renderDispatch();
                        renderSidebar();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .confirmWaybill(trip.suggestedWaybillId, customNumber);
            }

            function confirmDeleteTrip(tripId) {
                if (
                    !confirm(
                        "Remove this trip? It will be deleted permanently if it has no confirmed waybill.",
                    )
                )
                    return;
                setSyncing(true);
                srv()
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Delete failed: " + r.error, "error");
                            return;
                        }
                        closeSidebar();
                        showToast("Trip removed.", "success");
                        loadDispatch();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .deleteImportedTrip(tripId);
            }

            // ── ADD MANUAL TRIP MODAL ──────────────────────────────────
            function openMarkScheduledModal() {
                if (!canEdit()) {
                    showToast("Your role cannot schedule trips.", "warning");
                    return;
                }
                const count = (dispatchData?.trips || []).filter(
                    (t) => t.tripStatus === "Prepping",
                ).length;
                if (count === 0) {
                    showToast("No Prepping trips on this date.", "warning");
                    return;
                }
                document.getElementById("mds-summary").textContent =
                    `${count} Prepping trip${count === 1 ? "" : "s"} on ${document.getElementById("dispatch-date").value} will be marked Scheduled.`;
                populatePrefixSelects();
                openModal("modal-mark-scheduled");
            }

            function submitMarkScheduled() {
                const dateVal = document.getElementById("dispatch-date").value;
                const prefixId = Number(
                    document.getElementById("mds-prefix").value,
                );
                if (!prefixId) {
                    showToast("Select a waybill prefix.", "warning");
                    return;
                }
                closeModal("modal-mark-scheduled");
                setSyncing(true);
                srv()
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast(
                                "Scheduling failed: " + r.error,
                                "error",
                            );
                            return;
                        }
                        showToast(
                            `${r.promoted} trips Scheduled, ${r.waybillsSuggested} waybills suggested.`,
                            "success",
                        );
                        loadDispatch();
                    })
                    .markDayScheduled(isoToMDY(dateVal), prefixId);
            }

            function openAddTripModal() {
                if (!canEdit()) {
                    showToast("Your role cannot add trips.", "warning");
                    return;
                }
                document.getElementById("at-date").value =
                    document.getElementById("dispatch-date").value;
                populateAddTripSelects();
                openModal("modal-add-trip");
            }

            function populateAddTripSelects() {
                const outletSel = document.getElementById("at-outlet");
                if (outletSel) {
                    outletSel.innerHTML =
                        `<option value="">— Select outlet —</option>` +
                        outlets
                            .map(
                                (o) =>
                                    `<option value="${o.id}">${esc(o.outletName)}</option>`,
                            )
                            .join("");
                }
                const truckSel = document.getElementById("at-truck");
                if (truckSel) {
                    truckSel.innerHTML =
                        `<option value="">— Unassigned —</option>` +
                        trucks
                            .filter((t) => t.active !== false)
                            .map(
                                (t) =>
                                    `<option value="${t.id}">${esc(t.plate)} (${esc(t.type)})</option>`,
                            )
                            .join("");
                }
                const driverSel = document.getElementById("at-driver");
                if (driverSel) {
                    driverSel.innerHTML =
                        `<option value="">— Unassigned —</option>` +
                        employees
                            .filter(
                                (e) =>
                                    (e.role === "Driver" ||
                                        e.role === "Driver-Helper") &&
                                    e.active !== false,
                            )
                            .map(
                                (e) =>
                                    `<option value="${e.id}">${esc(e.nick)}</option>`,
                            )
                            .join("");
                }
            }

            function populatePrefixSelects() {
                ["at-prefix", "mds-prefix"].forEach((id) => {
                    const sel = document.getElementById(id);
                    if (!sel) return;
                    sel.innerHTML = waybillPrefixes
                        .map(
                            (p) =>
                                `<option value="${p.id}">${esc(p.prefix)} — ${esc(p.companyName)}</option>`,
                        )
                        .join("");
                });
            }

            function submitAddTrip() {
                const outletId = Number(
                    document.getElementById("at-outlet").value,
                );
                const outlet = outlets.find((o) => o.id === outletId);
                const truckId =
                    Number(document.getElementById("at-truck").value) || null;
                const driverId =
                    Number(document.getElementById("at-driver").value) || null;
                const qty =
                    Number(document.getElementById("at-qty").value) || null;
                const dateVal = document.getElementById("at-date").value;
                const prefixId =
                    Number(document.getElementById("at-prefix").value) || null;
                const remarks = document.getElementById("at-remarks").value;
                const fo = document.getElementById("at-fo").value.trim();

                if (!outletId) {
                    showToast("Select an outlet.", "warning");
                    return;
                }

                const tripData = {
                    foNumber: fo,
                    outletName: outlet ? outlet.outletName : "",
                    area: outlet ? outlet.area : "",
                    truckId,
                    driverId,
                    quantity: qty,
                    tripDate: isoToMDY(dateVal),
                    prefixId,
                    remarks,
                    source: "Manual",
                };

                setSyncing(true);
                srv()
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast("Add trip failed: " + r.error, "error");
                            return;
                        }
                        closeModal("modal-add-trip");
                        showToast(
                            `Trip added (ID ${r.tripId})${r.waybillSuggested ? " — waybill " + r.waybillSuggested + " suggested" : ""}`,
                            "success",
                        );
                        loadDispatch();
                    })
                    .withFailureHandler((e) => {
                        setSyncing(false);
                        showToast("Error: " + e.message, "error");
                    })
                    .createTrip(tripData);
            }
        </script>
