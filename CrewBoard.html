<script>
            // ── CREW BOARD (drag-and-drop truck assignment) ───────────
            // Alternate view of the dispatch panel: a rail of unassigned
            // trips and one card per truck; dragging a trip chip onto a
            // card assigns the truck (+ default driver when the trip has
            // none, same as the sidebar's truck change). Dropping back on
            // the rail unassigns. Every drop saves through saveTripChanges;
            // the sidebar stays the fine-detail editor (chip click opens it).

            function switchDispatchView(mode) {
                dispatchView = mode;
                document.getElementById("dispatch-table-wrap").style.display =
                    mode === "board" ? "none" : "";
                document.getElementById("crew-board").style.display =
                    mode === "board" ? "" : "none";
                document
                    .querySelectorAll("#view-pills .pill")
                    .forEach((b) =>
                        b.classList.toggle("active", b.dataset.view === mode),
                    );
                if (mode === "board") renderCrewBoard();
            }

            function cbChipHtml(t, outletMap, convoyCls) {
                const outletName =
                    (outletMap[t.outletId] || {}).outletName || "—";
                const cgCls = t.convoyGroup ? convoyCls[t.convoyGroup] : "";
                const drag = canEdit()
                    ? `draggable="true" ondragstart="cbDragStart(event, ${t.id})"`
                    : "";
                return `<div class="cb-chip ${cgCls}" ${drag} onclick="selectTrip(${t.id})" title="${esc(outletName)}">
      <span class="cb-chip-fo">${t.convoyGroup ? `<span class="convoy-badge ${cgCls}">C${esc(t.convoyGroup)}</span>` : ""}${esc(t.foNumber) || "—"}</span>
      <span class="cb-chip-outlet">${esc(outletName)}</span>
      <span class="cb-chip-meta">${t.cbm ? t.cbm + " cbm" : ""} <span class="status-chip ${statusChipClass(t.tripStatus)}">${shortStatus(t.tripStatus)}</span></span>
    </div>`;
            }

            function renderCrewBoard() {
                if (!dispatchData) return;
                const trips = dispatchData.trips || [];
                const outletMap = indexById(outlets);
                const empMap = indexById(employees);

                // Same convoy palette assignment as the table view.
                const convoyCls = {};
                trips.forEach((t) => {
                    if (t.convoyGroup && !(t.convoyGroup in convoyCls))
                        convoyCls[t.convoyGroup] =
                            "cg-" + (Object.keys(convoyCls).length % 6);
                });

                const unassigned = trips.filter((t) => !t.truckId);
                document.getElementById("cb-rail-count").textContent =
                    unassigned.length;
                document.getElementById("cb-rail-list").innerHTML =
                    unassigned.length
                        ? unassigned
                              .map((t) => cbChipHtml(t, outletMap, convoyCls))
                              .join("")
                        : `<div class="cb-empty">All trips have a truck 🎉</div>`;

                const byTruck = {};
                trips.forEach((t) => {
                    if (!t.truckId) return;
                    (byTruck[t.truckId] = byTruck[t.truckId] || []).push(t);
                });

                // Trucks with trips first (board order), then free active trucks.
                const active = trucks.filter((tk) => tk.active !== false);
                const withTrips = active.filter((tk) => byTruck[tk.id]);
                const free = active.filter((tk) => !byTruck[tk.id]);

                const cardHtml = (tk) => {
                    const tripChips = (byTruck[tk.id] || [])
                        .map((t) => cbChipHtml(t, outletMap, convoyCls))
                        .join("");
                    // Crew: today's assignment if any trip has one, else the
                    // roster default (shown grayed, it auto-fills on drop).
                    const withDriver = (byTruck[tk.id] || []).find(
                        (t) => t.driverId,
                    );
                    let crewHtml;
                    if (withDriver) {
                        const d = empMap[withDriver.driverId] || {};
                        const helpers = (withDriver.helperIds || [])
                            .map((h) => (empMap[h] || {}).nick)
                            .filter(Boolean);
                        crewHtml = `<span class="cb-crew-driver">${esc(d.nick || "?")}</span>${helpers.length ? ` <span class="cb-crew-helpers">+ ${esc(helpers.join(", "))}</span>` : ""}`;
                    } else {
                        const def = defaultAssignments.find(
                            (a) => a.truckId === tk.id,
                        );
                        const dd =
                            def && def.defaultDriverId
                                ? (empMap[def.defaultDriverId] || {}).nick
                                : "";
                        crewHtml = dd
                            ? `<span class="cb-crew-default">${esc(dd)} (default)</span>`
                            : `<span class="cb-crew-default">no crew</span>`;
                    }
                    const dz = canEdit()
                        ? `ondragover="cbDragOver(event)" ondragleave="cbDragLeave(event)" ondrop="cbDrop(event, ${tk.id})"`
                        : "";
                    return `<div class="cb-truck" ${dz}>
        <div class="cb-truck-head">
          <span class="cb-truck-plate">${esc(tk.plate)}</span>
          <span class="cb-truck-type">${esc(tk.billingCategory || tk.type || "")}</span>
        </div>
        <div class="cb-crew">${crewHtml}</div>
        <div class="cb-chips">${tripChips || '<div class="cb-empty">drop trips here</div>'}</div>
      </div>`;
                };

                document.getElementById("cb-cards").innerHTML = [
                    ...withTrips,
                    ...free,
                ]
                    .map(cardHtml)
                    .join("");
            }

            function cbDragStart(e, tripId) {
                e.dataTransfer.setData("text/plain", String(tripId));
                e.dataTransfer.effectAllowed = "move";
            }
            function cbDragOver(e) {
                e.preventDefault();
                e.currentTarget.classList.add("cb-drop-hover");
            }
            function cbDragLeave(e) {
                e.currentTarget.classList.remove("cb-drop-hover");
            }
            function cbDrop(e, truckId) {
                e.preventDefault();
                e.currentTarget.classList.remove("cb-drop-hover");
                const tripId = Number(e.dataTransfer.getData("text/plain"));
                if (tripId) handleTripDrop(tripId, truckId);
            }

            function handleTripDrop(tripId, truckId) {
                const trip = (dispatchData.trips || []).find(
                    (t) => t.id === tripId,
                );
                if (!trip || trip.truckId === truckId) return;

                const changes = { truckId: truckId };
                // Mirror the sidebar's truck change: pre-fill the default
                // driver only when the trip has none yet.
                if (truckId && !trip.driverId) {
                    const def = defaultAssignments.find(
                        (a) => a.truckId === truckId,
                    );
                    if (def && def.defaultDriverId)
                        changes.driverId = def.defaultDriverId;
                }
                if (!truckId) changes.truckId = null;

                setSyncing(true);
                srv()
                    .withSuccessHandler((r) => {
                        setSyncing(false);
                        if (!r.success) {
                            showToast(r.error, "error");
                            return;
                        }
                        Object.assign(trip, r.trip);
                        if (r.routeFrequencyWarning) {
                            showToast(
                                `${r.routeFrequencyWarning.count} deliveries to ${r.routeFrequencyWarning.outletName} in 21 days for this driver.`,
                                "warning",
                            );
                        }
                        renderDispatch();
                        if (selectedTripId === tripId) renderSidebar();
                    })
                    .saveTripChanges(tripId, changes);
            }
        </script>
