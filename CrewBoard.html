<script>
            // ── CREW BOARD (drag-and-drop crew assignment) ────────────
            // Alternate view of the dispatch panel. A rail of draggable crew
            // cards (one per active truck, showing its default driver/helpers)
            // on the left; the trips are drop targets on the right. Dragging a
            // crew onto a trip assigns that truck + its whole default crew.
            // Every drop reuses assignCrew() — optimistic, saves in the
            // background — so it feels instant.

            function switchDispatchView(mode) {
                dispatchView = mode;
                document.getElementById("dispatch-table-wrap").style.display =
                    mode === "board" ? "none" : "";
                document.getElementById("crew-board").style.display =
                    mode === "board" ? "" : "none";
                document
                    .querySelectorAll("#view-pills .pill")
                    .forEach((b) =>
                        b.classList.toggle("active", b.dataset.view === mode),
                    );
                if (mode === "board") renderCrewBoard();
            }

            function cbCrewCardHtml(tk, empMap) {
                const def = defaultAssignments.find(
                    (a) => Number(a.truckId) === Number(tk.id),
                );
                const driver =
                    def && def.defaultDriverId
                        ? (empMap[def.defaultDriverId] || {}).nick
                        : "";
                const helpers = def
                    ? (def.defaultHelperIds || [])
                          .map((h) => (empMap[h] || {}).nick)
                          .filter(Boolean)
                    : [];
                const drag = canEdit()
                    ? `draggable="true" ondragstart="cbCrewDragStart(event, ${tk.id})"`
                    : "";
                // Driver / helper on top, plate below (swapped from the old card).
                const crewLine = driver
                    ? `<span class="cb-crew-driver">${esc(driver)}</span>${helpers.length ? ` <span class="cb-crew-helpers">+ ${esc(helpers.join(", "))}</span>` : ""}`
                    : `<span class="cb-crew-default">no default crew</span>`;
                return `<div class="cb-crew-card" ${drag} title="Drag onto a trip to assign">
      <div class="cb-crew-line">${crewLine}</div>
      <div class="cb-crew-plate">${esc(tk.plate)} · ${esc(tk.billingCategory || tk.type || "")}</div>
    </div>`;
            }

            function cbTripCardHtml(t, outletMap, empMap, truckMap, convoyCls) {
                const outletName =
                    (outletMap[t.outletId] || {}).outletName || "—";
                const cgCls = t.convoyGroup ? convoyCls[t.convoyGroup] : "";
                const driver = (empMap[t.driverId] || {}).nick || "";
                const helpers = (t.helperIds || [])
                    .map((h) => (empMap[h] || {}).nick)
                    .filter(Boolean);
                const assigned = t.truckId
                    ? `<span class="cb-tc-plate">${esc((truckMap[t.truckId] || {}).plate || "?")}</span>
         <span class="cb-tc-driver">${esc(driver || "no driver")}</span>${helpers.length ? ` <span class="cb-crew-helpers">+ ${esc(helpers.join(", "))}</span>` : ""}
         ${canEdit() ? `<button class="cb-unassign" onclick="cbUnassign(${t.id})" title="Unassign crew">✕</button>` : ""}`
                    : `<span class="cb-tc-empty">drop a crew here</span>`;
                const dz = canEdit()
                    ? `ondragover="cbDragOver(event)" ondragleave="cbDragLeave(event)" ondrop="cbTripDrop(event, ${t.id})"`
                    : "";
                return `<div class="cb-truck ${cgCls}" ${dz}>
        <div class="cb-truck-head">
          <span class="cb-chip-fo">${t.convoyGroup ? `<span class="convoy-badge ${cgCls}">C${esc(t.convoyGroup)}</span>` : ""}${esc(t.foNumber) || "—"}</span>
          <span class="status-chip ${statusChipClass(t.tripStatus)}">${shortStatus(t.tripStatus)}</span>
        </div>
        <div class="cb-chip-outlet">${esc(outletName)}</div>
        <div class="cb-chip-meta">${t.area ? esc(t.area) + " · " : ""}${t.cbm ? t.cbm + " cbm" : ""}</div>
        <div class="cb-tc-crew">${assigned}</div>
      </div>`;
            }

            function renderCrewBoard() {
                if (!dispatchData) return;
                const trips = dispatchData.trips || [];
                const outletMap = indexById(outlets);
                const empMap = indexById(employees);
                const truckMap = indexById(trucks);

                // Same convoy palette assignment as the table view.
                const convoyCls = {};
                trips.forEach((t) => {
                    if (t.convoyGroup && !(t.convoyGroup in convoyCls))
                        convoyCls[t.convoyGroup] =
                            "cg-" + (Object.keys(convoyCls).length % 6);
                });

                const active = trucks.filter((tk) => tk.active !== false);
                document.getElementById("cb-rail-count").textContent =
                    active.length;
                document.getElementById("cb-rail-list").innerHTML = active.length
                    ? active.map((tk) => cbCrewCardHtml(tk, empMap)).join("")
                    : `<div class="cb-empty">No active trucks.</div>`;

                document.getElementById("cb-cards").innerHTML = trips.length
                    ? trips
                          .map((t) =>
                              cbTripCardHtml(
                                  t,
                                  outletMap,
                                  empMap,
                                  truckMap,
                                  convoyCls,
                              ),
                          )
                          .join("")
                    : `<div class="cb-empty">No trips for this date.</div>`;
            }

            function cbCrewDragStart(e, truckId) {
                e.dataTransfer.setData("text/plain", String(truckId));
                e.dataTransfer.effectAllowed = "move";
            }
            function cbDragOver(e) {
                e.preventDefault();
                e.currentTarget.classList.add("cb-drop-hover");
            }
            function cbDragLeave(e) {
                e.currentTarget.classList.remove("cb-drop-hover");
            }
            function cbTripDrop(e, tripId) {
                e.preventDefault();
                e.currentTarget.classList.remove("cb-drop-hover");
                const truckId = Number(e.dataTransfer.getData("text/plain"));
                if (truckId) assignCrew(tripId, truckId);
            }
            function cbUnassign(tripId) {
                assignCrew(tripId, "");
            }
        </script>
