name: 🐞 Bug Report
description: Report a problem with the AngeLoyal OMS so the developer can fix it.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the system! Tell us what happened, what you
        were doing right before it happened, and what you expected instead.
        Feel free to paste in a screenshot too. You don't need to know
        anything technical. 🙂
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Describe the problem, the steps to reproduce it, and what you expected instead.
      placeholder: |
        e.g. I clicked "Confirm Waybill" on the Dispatch screen and the page showed a red error message.

        Steps: 1. ... 2. ... 3. ...

        Expected: the waybill should have been saved and shown as Confirmed.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        After you click **Submit new issue**, the developer is notified automatically —
        no need to message separately. Thank you! 🙏
